<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dark-theme">
  <div class="theme-toggle-container">
    <label class="theme-switch">
      <input type="checkbox" id="theme-toggle" checked>
      <span class="slider"></span>
    </label>
    <span class="theme-label">TEMA</span>
  </div>
  <h1 class="game-title">TETRIS</h1>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <!-- records: formulario de nombre + tabla -->
        <form id="name-form" class="name-form hidden" autocomplete="off">
          <label for="name-input">¡Nuevo récord! Tu nombre:</label>
          <div class="name-row">
            <input id="name-input" type="text" maxlength="12" placeholder="Nombre" />
            <button type="submit" id="name-save">Guardar</button>
          </div>
        </form>
        <div id="records-over" class="records"></div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <!-- records: pantalla de inicio -->
    <div id="start-overlay" class="overlay">
      <div class="overlay-box">
        <p class="start-title">TETRIS</p>
        <div id="records-start" class="records"></div>
        <div class="rec-actions">
          <button id="start-btn" class="rec-btn">Jugar</button>
          <button id="reset-records-btn" class="rec-btn rec-btn-alt">Resetear records</button>
        </div>
      </div>
    </div>
  </div>

  <script src="records.js"></script>
  <script src="game.js"></script>
</body>
</html>
